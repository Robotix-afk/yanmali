<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YanMali — Mali Müşavir Paneli</title>
<style>
:root{
  --forest:#20554e;--forest-900:#163d38;--forest-800:#1a4a44;
  --lime:#b7ff8b;--lime-h:#a8ee85;--teal:#0d9488;--teal-btn:#14b8a6;
  --ink:#101a28;--mut:#585f69;--line:#e7e8e9;--bg:#f4f6f9;--card:#fff;
  --purple:#6366f1;--red:#ef4444;
}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
.hide{display:none!important}

/* LANDING */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 24px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--forest)}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--forest);display:flex;align-items:center;justify-content:center;color:#fff}
.brand-mark svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;border:none;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
.btn-lime{background:var(--lime);color:var(--ink)}.btn-lime:hover{background:var(--lime-h)}
.btn-dark{background:var(--forest);color:#fff}.btn-dark:hover{background:var(--forest-900)}
.btn-teal{background:var(--teal-btn);color:#fff}.btn-teal:hover{filter:brightness(.95)}
.btn-ghost{background:transparent;color:var(--ink)}.btn-ghost:hover{text-decoration:underline}
.btn-lg{padding:14px 22px;font-size:15px}.btn-block{width:100%}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-purple{background:var(--purple);color:#fff}
.btn-red{background:var(--red);color:#fff}
.land-main{padding-top:72px}
.hero{background:linear-gradient(160deg,var(--forest-900),var(--forest));color:#fff;padding:56px 24px 64px;text-align:center}
.hero h1{font-size:clamp(28px,4vw,42px);font-weight:700;max-width:720px;margin:0 auto 14px;line-height:1.25}
.hero p{max-width:560px;margin:0 auto 22px;opacity:.92;font-size:16px}
.hero .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.badge-free{display:inline-block;background:rgba(183,255,139,.2);color:var(--lime);border:1px solid rgba(183,255,139,.45);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;margin-bottom:16px}
.section{padding:56px 24px;max-width:1100px;margin:0 auto}
.section h2{font-size:28px;font-weight:700;margin-bottom:10px;text-align:center}
.section .lead{text-align:center;color:var(--mut);max-width:640px;margin:0 auto 28px}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.feat{border:1px solid var(--line);border-radius:14px;padding:20px;background:#fff}
.feat .ic{width:40px;height:40px;border-radius:10px;background:#e8f5f1;color:var(--forest);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.feat .ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.feat h3{font-size:16px;margin-bottom:6px}.feat p{font-size:14px;color:var(--mut)}
.cta-band{background:#f4faf7;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:48px 24px;text-align:center}
.faq{max-width:720px;margin:0 auto}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{width:100%;text-align:left;background:none;border:none;padding:16px 0;font-size:16px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.faq-a{display:none;padding:0 0 16px;color:var(--mut);font-size:14px}
.faq-item.open .faq-a{display:block}
.footer{background:var(--forest-900);color:#c5d5d1;padding:40px 24px 24px}
.footer-inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between}
.footer a{color:#e8f5f1}.footer-copy{max-width:1100px;margin:24px auto 0;padding-top:16px;border-top:1px solid var(--forest-800);font-size:13px;color:#8aa39c;text-align:center}

/* AUTH */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-left{padding:32px;display:flex;flex-direction:column}
.auth-left-inner{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100%}
.auth-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--forest)}
.auth-form-box{margin:auto 0;padding:24px 0;width:100%}
.auth-form-box h1{font-size:24px;font-weight:600;text-align:center;margin-bottom:24px}
.auth-form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{color:var(--mut);font-weight:500;font-size:14px}
.field input,.field textarea{background:#fff;font-size:16px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 2px rgba(32,85,78,.05)}
.field input:focus,.field textarea:focus{outline:1px solid #28313e}
.auth-error{background:#fef3f2;border:1px solid #fecdca;border-radius:8px;padding:12px;color:#d92d20;font-size:14px;text-align:center}
.auth-foot{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--mut);font-size:13px;margin-top:auto;padding-top:16px}
.auth-right{padding:32px 32px 32px 0}
.auth-panel{border-radius:32px;width:100%;height:100%;min-height:560px;overflow:hidden;position:relative;background:var(--forest-900);display:flex;flex-direction:column;justify-content:flex-end}
.auth-panel-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(183,255,139,.18),transparent 50%),linear-gradient(160deg,#1a4a44 0%,#0f2e2a 100%)}
.auth-panel-content{position:relative;z-index:1;padding:32px;color:#fff}
.auth-panel-content h2{font-size:32px;font-weight:600;line-height:1.3;margin-bottom:12px;max-width:480px}
.auth-panel-content p{font-size:18px;opacity:.9;max-width:460px}
.slide-dots{position:absolute;bottom:24px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:2}
.slide-dots button{width:10px;height:10px;border-radius:50%;border:none;background:rgba(255,255,255,.35);cursor:pointer;padding:0}
.slide-dots button.on{background:#fff}

/* PANEL SHELL */
.p-shell{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.p-top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;gap:8px;position:sticky;top:0;z-index:40}
.p-top-left{display:flex;align-items:center;gap:0;height:100%}
.p-logo{width:40px;height:40px;border-radius:10px;background:var(--teal);display:flex;align-items:center;justify-content:center;color:#fff;margin-right:12px}
.p-logo svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.p-tabs{display:flex;height:100%}
.p-tab{display:flex;align-items:center;padding:0 18px;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--mut);border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent;height:100%}
.p-tab.on{color:var(--ink);background:#f1f5f9;border-bottom-color:var(--purple)}
.p-top-right{display:flex;align-items:center;gap:10px;position:relative}
.p-hello{font-size:13px;color:var(--mut)}
.p-avatar{width:36px;height:36px;border-radius:50%;background:#c7d2fe;color:#3730a3;border:none;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center}
.p-menu{position:absolute;top:48px;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.12);min-width:220px;padding:8px;display:none;z-index:50}
.p-menu.open{display:block}
.p-menu button{width:100%;text-align:left;padding:10px 12px;border:none;background:transparent;border-radius:8px;cursor:pointer;font-size:14px;color:#334155;display:flex;align-items:center;gap:10px}
.p-menu button:hover{background:#f8fafc}
.p-body{flex:1;padding:24px;max-width:1100px;width:100%;margin:0 auto}
.p-card{background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:24px}
.p-card h2{font-size:18px;font-weight:600;margin-bottom:16px;color:#334155}
.subtabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.subtab{padding:10px 4px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.on{color:var(--purple);border-bottom-color:var(--purple);font-weight:600}
.info-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.info-msg{background:#dbeafe;color:#1e40af;padding:12px 16px;border-radius:8px;font-size:13px;flex:1;min-width:200px}
.empty-c{text-align:center;padding:40px 16px;color:var(--mut);font-size:14px}
.pager{text-align:center;padding:12px;color:var(--mut);font-size:13px}

/* Help layout with side nav */
.help-layout{display:grid;grid-template-columns:220px 1fr;gap:0;min-height:calc(100vh - 56px)}
.help-side{background:#0f172a;color:#94a3b8;padding:16px 0;min-height:100%}
.help-side a,.help-side button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 18px;border:none;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;text-align:left}
.help-side a:hover,.help-side button:hover,.help-side .on{color:#fff;background:rgba(255,255,255,.06)}
.help-main{padding:28px 24px}
.help-main h2{color:var(--teal);font-size:22px;margin-bottom:10px}
.note-box{background:#ecfeff;border:1px solid #a5f3fc;color:#0e7490;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:16px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700}
.modal-b{padding:18px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal .hint{background:#ecfeff;color:#0e7490;padding:12px;border-radius:8px;font-size:13px;margin-bottom:14px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}

@media(max-width:900px){
  .auth-wrap{grid-template-columns:1fr}.auth-right{display:none}
  .help-layout{grid-template-columns:1fr}
  .help-side{display:none}
  .p-hello{display:none}
}

/* Mükellef list refined */
.muk-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.muk-search{padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;min-width:160px}
.muk-table{width:100%;border-collapse:collapse;font-size:13px}
.muk-table thead th{background:#eef2f7;color:#475569;font-weight:600;text-align:left;padding:12px 14px;border-bottom:1px solid #e2e8f0}
.muk-table td{padding:14px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle}
.muk-table tr:hover td{background:#f8fafc}
.muk-row:hover td{background:#eef2ff!important}
.muk-del{background:none;border:none;color:#ef4444;cursor:pointer;font-size:16px;padding:4px 8px}
.muk-go{width:32px;height:32px;border-radius:6px;background:var(--teal-btn);border:none;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.muk-go:hover{filter:brightness(.95)}
.pager-row{display:flex;justify-content:center;align-items:center;gap:8px;padding:16px;color:#94a3b8;font-size:13px}
.pager-row .pg{background:#3b82f6;color:#fff;border:none;border-radius:4px;width:28px;height:28px;font-weight:700}

/* Mükellef workspace */
.ws{display:grid;grid-template-columns:220px 1fr;min-height:100vh;background:#f4f6f9}
.ws-side{background:#0f172a;color:#94a3b8;display:flex;flex-direction:column;padding:12px 0}
.ws-brand{padding:8px 16px 16px;font-weight:800;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px}
.ws-brand span{color:#5eead4;font-size:11px;font-weight:600;display:block}
.ws-nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;border:none;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;text-align:left}
.ws-nav button:hover,.ws-nav button.on{color:#fff;background:rgba(255,255,255,.06)}
.ws-nav .dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex-shrink:0}
.ws-nav button.on .dot{background:#5eead4}
.ws-foot{margin-top:auto;padding:12px 16px;font-size:10px;color:#64748b}
.ws-main{display:flex;flex-direction:column;min-width:0}
.ws-top{background:#fff;border-bottom:1px solid #e5e7eb;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px}
.ws-firm{display:flex;align-items:center;gap:8px;background:#f1f5f9;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;color:#334155;border:none;cursor:pointer}
.ws-firm-av{width:28px;height:28px;border-radius:50%;background:#cbd5e1;display:flex;align-items:center;justify-content:center;font-size:12px;color:#475569}
.ws-body{padding:20px 24px;flex:1}
.ws-title{font-size:18px;font-weight:600;color:#334155;margin-bottom:14px}
.ws-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ws-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);min-height:120px}
.ws-card h4{font-size:14px;color:#475569;margin-bottom:8px;display:flex;justify-content:space-between}
.ws-card .empty{color:#94a3b8;font-size:13px;font-style:italic}
.ws-banner{background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:14px;border-left:4px solid #f43f5e;font-size:13px;color:#475569;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.ws-info{background:#e0f2fe;color:#0c4a6e;padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.ws-warn{background:#ffe4e6;color:#9f1239;padding:12px 14px;border-radius:8px;font-size:13px}
.ws-toolbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
@media(max-width:900px){
  .ws{grid-template-columns:1fr}
  .ws-side{display:none}
  .ws-cards{grid-template-columns:1fr}
}

</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var FREE_UNTIL = new Date('2026-11-26T23:59:59');
  function toast(m){var e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(function(){e.classList.remove('show')},2600)}
  function isFree(){return new Date()<=FREE_UNTIL}
  function logoSvg(){return '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/><path d="M2 12h20"/></svg>'}
  function ic(n){
    var m={
      users:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>',
      key:'<path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
      help:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
      out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
      check:'<polyline points="20 6 9 17 4 12"/>',
      x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
      home:'<path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1v-9.5z"/>',
      file:'<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/>'
    };
    return '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">'+ (m[n]||m.file) +'</svg>';
  }

  /* session mock for UI */
  function genMusteriNo(){
    return String(Math.floor(100000 + Math.random() * 900000));
  }
  function setSess(s){
    if(s && !s.musteriNo) s.musteriNo = genMusteriNo();
    localStorage.setItem('yanmali_ui_sess', JSON.stringify(s));
  }
  function getSess(){
    try {
      var s = JSON.parse(localStorage.getItem('yanmali_ui_sess') || 'null');
      if (s && !s.musteriNo) { s.musteriNo = genMusteriNo(); setSess(s); }
      return s;
    } catch (e) { return null; }
  }
  function clearSess(){ localStorage.removeItem('yanmali_ui_sess'); }

  var INV_KEY='ym_yanmali_invites_v1';
  var NOTIF_KEY='ym_yanmali_notifs_v1';
  function readInvites(){ try{ return JSON.parse(localStorage.getItem(INV_KEY)||'[]'); }catch(e){ return []; } }
  function writeInvites(a){ localStorage.setItem(INV_KEY, JSON.stringify(a||[])); }
  function readNotifs(){ try{ return JSON.parse(localStorage.getItem(NOTIF_KEY)||'[]'); }catch(e){ return []; } }
  function writeNotifs(a){ localStorage.setItem(NOTIF_KEY, JSON.stringify(a||[])); }
  function pushNotif(toNo, msg, kind){
    var n=readNotifs();
    n.push({ id:'n'+Date.now()+Math.random().toString(36).slice(2,6), toMusteriNo:String(toNo||''), msg:msg, kind:kind||'info', read:false, ts:new Date().toISOString() });
    writeNotifs(n);
  }
  function uidInv(){ return 'inv_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function route(){
    var h=(location.hash||'#/').replace(/^#/,'')||'/';
    if(h.indexOf('?')>=0)h=h.split('?')[0];
    h=h.replace(/\/+$/,'')||'/';
    return h;
  }
  function go(p){
    p=String(p||'/');
    if(p.charAt(0)!=='/') p='/'+p;
    if(location.hash.replace(/^#/,'')===p){ render(); return; }
    location.hash=p;
  }

  var slides=[
    {h:'YanMali Ayrıcalıkları Sizi Bekliyor!',p:'Mükelleflerinizin YanMuhasebe verilerine tek panelden erişin.'},
    {h:'Zamanınızın Değerini Biliyoruz',p:'Satış, alış, masraf ve stok özetleri anında masanızda.'},
    {h:'Davet ile Güvenli Bağlantı',p:'Mükellef sizi e-posta ile davet eder; yetkiler net ve kontrollüdür.'}
  ];
  var slideIdx=0;

  /* ===== LANDING ===== */
  function viewLand(){
    return '<header class="topbar"><a class="brand" href="#/"><span class="brand-mark">'+logoSvg()+'</span> YanMali</a>'+
      '<nav style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
      '<a class="btn btn-ghost" href="#/giris">Giriş Yap</a>'+
      '<a class="btn btn-lime" href="#/kayit">Ücretsiz Hesap Oluştur</a>'+
      '<a class="btn btn-dark" href="index.html">YanMuhasebe</a></nav></header>'+
      '<main class="land-main"><section class="hero">'+
      (isFree()?'<div class="badge-free">26.11.2026 tarihine kadar ücretsiz</div>':'')+
      '<h1>İşinizi Kolaylaştıracak Çözümler Biz’de!</h1>'+
      '<p>Mükelleflerinizin YanMuhasebe verilerine online erişin. Cari, satış, alış, masraf, stok ve raporları tek panelden takip edin.</p>'+
      '<div class="actions"><a class="btn btn-lime btn-lg" href="#/kayit">Ücretsiz Başlayın</a>'+
      '<a class="btn btn-ghost btn-lg" href="#/giris" style="color:#fff;border:1px solid rgba(255,255,255,.35)">Giriş Yap</a></div></section>'+
      '<section class="section"><h2>YanMali’de neler var?</h2>'+
      '<p class="lead">Pratik arayüz ile mükellef verilerine her yerden erişin.</p>'+
      '<div class="feat-grid">'+

  function viewMukellefler(){
    var tab=(location.hash.indexOf('onay')>=0)?'onay':'liste';
    var s=getSess()||{};
    var myNo=String(s.musteriNo||'');
    var all=readInvites();
    var q=((location.hash.split('?q=')[1]||'')+'').toLowerCase();

    var rows=[];
    if(tab==='liste'){
      all.filter(function(x){
        if(x.status!=='accepted') return false;
        return String(x.mmMusteriNo)===myNo;
      }).forEach(function(x){
        rows.push({
          id:x.id,
          no:x.mukMusteriNo||x.fromMusteriNo||'-',
          ad:x.mukName||x.fromName||'—',
          em:x.mukEmail||x.fromEmail||'—',
          personel:x.atanmisPersonel||'—'
        });
      });
    } else {
      all.filter(function(x){ return x.status==='pending_mm' && String(x.mmMusteriNo)===myNo; }).forEach(function(x){
        rows.push({ id:x.id, no:x.mukMusteriNo||x.fromMusteriNo||'-', ad:x.mukName||x.fromName||'—', em:x.mukEmail||x.fromEmail||'—', personel:'—', pending:'mm' });
      });
      all.filter(function(x){ return x.status==='pending_muk' && String(x.mmMusteriNo)===myNo; }).forEach(function(x){
        rows.push({ id:x.id, no:x.mukMusteriNo||'-', ad:x.mukName||'—', em:x.mukEmail||'—', personel:'—', pending:'wait' });
      });
    }
    if(q){
      rows=rows.filter(function(r){
        return (r.ad+r.em+r.no).toLowerCase().indexOf(q)>=0;
      });
    }

    var notifs=readNotifs().filter(function(n){ return String(n.toMusteriNo)===myNo && !n.read; }).slice(-5);
    var notifHtml=notifs.length ? '<div style="margin-bottom:14px">'+notifs.map(function(n){
      var bg=n.kind==='ok'?'#dcfce7;color:#166534':(n.kind==='bad'?'#fee2e2;color:#991b1b':'#dbeafe;color:#1e40af');
      return '<div class="info-msg" style="margin-bottom:6px;background:'+bg+'">'+esc(n.msg)+
        ' <button type="button" class="btn btn-ghost" style="padding:2px 8px;font-size:12px" data-nr="'+n.id+'">Tamam</button></div>';
    }).join('')+'</div>' : '';

    var body='';
    if(!rows.length){
      body='<tr><td colspan="5" style="padding:36px;text-align:center;color:#94a3b8">'+(tab==='onay'?'Onay bekleyen mükellef yok':'Kayıtlı mükellef yok')+'</td></tr>';
    } else {
      body=rows.map(function(r){
        var acts='';
        if(tab==='onay' && r.pending==='mm'){
          acts='<button type="button" class="btn btn-teal" style="padding:6px 10px;font-size:12px" data-acc="'+r.id+'">Onayla</button> '+
               '<button type="button" class="btn btn-red" style="padding:6px 10px;font-size:12px" data-rej="'+r.id+'">Reddet</button>';
        } else if(tab==='liste'){
          acts='<button type="button" class="muk-del" title="Sil" data-del="'+r.id+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>';
        }
        var giris=tab==='liste'
          ? '<button type="button" class="muk-go" title="Giriş" data-giris="'+r.id+'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>'
          : (r.pending==='wait'?'Bekleniyor':'');
        var firma='('+esc(r.no)+') '+esc(r.ad);
        return '<tr class="'+(tab==='liste'?'muk-row':'')+'" '+(tab==='liste'?'data-giris="'+r.id+'" style="cursor:pointer"':'')+'>'+
          '<td><span style="color:#0f172a;font-weight:600">'+firma+'</span></td>'+
          '<td>'+esc(r.em)+'</td>'+
          '<td>'+esc(r.personel)+'</td>'+
          '<td style="text-align:center" onclick="event.stopPropagation()">'+acts+'</td>'+
          '<td style="text-align:center" onclick="event.stopPropagation()">'+giris+'</td></tr>';
      }).join('');
    }

    return '<div class="p-shell">'+panelTop('mukellefler')+
      '<div class="p-body"><div class="p-card"><h2>Mükellefleriniz</h2>'+notifHtml+
      '<div class="subtabs">'+
      '<button type="button" class="subtab'+(tab==='liste'?' on':'')+'" data-go="#/mukellefler">Mükellefler</button>'+
      '<button type="button" class="subtab'+(tab==='onay'?' on':'')+'" data-go="#/mukellefler-onay">Onay Bekleyenler</button>'+
      '</div>'+
      '<div class="muk-toolbar">'+
      '<input class="muk-search" id="mukSearch" placeholder="Ara..." value="'+esc(q)+'">'+
      (tab==='liste'?'<button type="button" class="btn btn-teal" id="btnYeniMuk">'+ic('check')+' Yeni Mükellef Ekle</button>':'')+
      '</div>'+
      '<div style="overflow-x:auto"><table class="muk-table">'+
      '<thead><tr><th>Firma Adı</th><th>E-Posta</th><th>Atanmış Personel</th><th style="text-align:center">Sil</th><th style="text-align:center">Giriş</th></tr></thead>'+
      '<tbody>'+body+'</tbody></table></div>'+
      '<div class="pager-row"><span>« Önceki</span><button type="button" class="pg">1</button><span>Sonraki »</span></div>'+
      '</div></div></div>'+
      modalMukellef();
  }

    if(tab==='liste'){
      all.filter(function(x){ return x.status==='accepted' && String(x.mmMusteriNo)===myNo; }).forEach(function(x){
        rows.push({ id:x.id, no:x.calMusteriNo||'-', ad:x.calName||'—', unvan:x.calUnvan||'—', st:'Aktif' });
      });
    } else {
      all.filter(function(x){ return (x.status==='pending_cal'||x.status==='pending_muk') && String(x.mmMusteriNo)===myNo; }).forEach(function(x){
        rows.push({ id:x.id, no:x.calMusteriNo||'-', ad:x.calName||'—', unvan:x.calUnvan||'—', st:'Onay bekleniyor', pending:true });
      });
    }
    var body=rows.length?rows.map(function(r){
      var acts=tab==='liste'
        ? '<button type="button" class="muk-del" data-del-cal="'+r.id+'" title="Sil"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button>'
        : '';
      return '<tr><td>('+esc(r.no)+') '+esc(r.ad)+'</td><td>'+esc(r.unvan)+'</td><td>'+esc(r.st)+'</td><td style="text-align:center">'+acts+'</td></tr>';
    }).join(''):'<tr><td colspan="4" style="padding:32px;text-align:center;color:#94a3b8">'+(tab==='onay'?'Onay bekleyen çalışan yok':'Kayıtlı çalışan yok')+'</td></tr>';

    return '<div class="p-shell">'+panelTop('calisanlar')+
      '<div class="p-body"><div class="p-card"><h2>Çalışanlarınız</h2>'+
      '<div class="subtabs">'+
      '<button type="button" class="subtab'+(tab==='liste'?' on':'')+'" data-go="#/calisanlar">Çalışanlarınız</button>'+
      '<button type="button" class="subtab'+(tab==='onay'?' on':'')+'" data-go="#/calisanlar-onay">Onay Bekleyenler</button>'+
      '</div>'+
      '<div class="muk-toolbar">'+
      '<div class="info-msg" style="flex:1">'+(tab==='onay'
        ?'Davet ettiğiniz çalışanlar, YanMuhasebe hesabından onaylayana kadar burada görünür.'
        :'Çalışanları müşteri numarası ile davet edin. Onay sonrası ofis listenizde yer alır.')+'</div>'+
      '<button type="button" class="btn btn-teal" id="btnYeniCal">'+ic('check')+' Yeni Çalışan Davet Et</button>'+
      '</div>'+
      '<div style="overflow-x:auto"><table class="muk-table">'+
      '<thead><tr><th>Ad Soyad / Müşteri No</th><th>Unvan</th><th>Durum</th><th style="text-align:center">Sil</th></tr></thead>'+
      '<tbody>'+body+'</tbody></table></div>'+
      '</div></div></div>'+
      modalCalisan();
  }

  function modalCalisan(){
    return '<div class="modal-bg hide" id="modalCal"><div class="modal">'+
      '<div class="modal-h"><span>Yeni Çalışan Davet Et</span><button type="button" class="btn btn-ghost" id="closeCal">'+ic('x')+'</button></div>'+
      '<div class="modal-b">'+
      '<div class="hint">Çalışanın <b>6 haneli müşteri numarası</b> ve ad soyadını girin. YanMuhasebe hesabı olan kullanıcı daveti onaylar (mükellef davetiyle aynı mantık).</div>'+
      '<div class="field" style="margin-bottom:12px"><label>Çalışan Müşteri No</label><input id="calNo" placeholder="Örn: 258963" maxlength="6" inputmode="numeric"></div>'+
      '<div class="field" style="margin-bottom:12px"><label>Ad Soyad</label><input id="calAd" placeholder="Çalışan adı soyadı"></div>'+
      '<div class="field"><label>Unvan (isteğe bağlı)</label><input id="calUnvan" placeholder="Muhasebe personeli"></div>'+
      '</div>'+
      '<div class="modal-f"><button type="button" class="btn btn-outline" id="cancelCal">Vazgeç</button>'+
      '<button type="button" class="btn btn-teal" id="sendCal">'+ic('check')+' Davet Gönder</button></div></div></div>';
  }

  function viewSifre(){
    return '<div class="p-shell">'+panelTop('')+
      '<div class="p-body" style="max-width:560px"><h2 style="margin-bottom:14px;font-size:18px">Şifre Yenileme</h2>'+
      '<div class="note-box">Not: Şifreniz en az <b>1 büyük harf</b>, <b>1 küçük harf</b>, <b>1 rakam</b> ve en az <b>1 özel karakter</b> içermelidir.</div>'+
      '<div class="p-card">'+
      '<div class="field" style="margin-bottom:12px"><label>Yeni Şifre</label><input type="password" id="np1" placeholder="Yeni Şifre"></div>'+
      '<div class="field" style="margin-bottom:16px"><label>Yeni Şifre (Tekrar)</label><input type="password" id="np2" placeholder="Yeni Şifre (Tekrar)"></div>'+
      '<div style="text-align:right"><button type="button" class="btn btn-purple" id="btnSavePass">Kaydet</button></div>'+
      '</div></div></div>';
  }

  function viewYardim(){
    var items=[
      ['Ana Sayfa','#/mukellefler'],['Maaş Tahakkukları','#'],['Vergi Tahakkukları','#'],
      ['Finansal Tablolar','#'],['Alış Faturaları','#'],['Satış Faturaları','#'],
      ['SMM','#'],['KDV Detayları','#'],['Çekler','#'],['Senetler','#'],
      ['Masraflar','#'],['BA-BS','#'],['Vadesi Geçenler','#'],['Stok Durum','#'],
      ['Banka Hareketleri','#'],['Müşteri Listesi','#']
    ];
    var side=items.map(function(x,i){
      return '<button type="button" class="'+(i===0?'on':'')+'" data-go="'+x[1]+'">'+x[0]+'</button>';
    }).join('');
    return '<div class="p-shell">'+panelTop('')+
      '<div class="help-layout"><aside class="help-side">'+side+
      '<div style="padding:16px 18px;font-size:11px;color:#64748b;margin-top:auto">2014, 2026 © YanMuhasebe<br>v1.0</div></aside>'+
      '<div class="help-main"><div class="p-card" style="max-width:640px">'+
      '<h2>Bize yazın...</h2>'+
      '<p style="font-size:14px;color:var(--mut);margin-bottom:16px"><strong style="color:var(--teal)">YanMali</strong> kullanırken bir problemle karşılaşırsanız aşağıdaki formu doldurun, en kısa zamanda cevaplayalım.</p>'+
      '<div class="field" style="margin-bottom:14px"><label>Mesajınız</label>'+
      '<textarea id="helpMsg" rows="5" placeholder="Size daha hızlı yardımcı olabilmemiz için mümkün olduğu kadar detaylı yazmanızı, gerekirse ekran resmi eklemenizi rica ediyoruz."></textarea></div>'+
      '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">'+
      '<button type="button" class="btn btn-teal" id="btnFile">Dosya Ekle</button>'+
      '<button type="button" class="btn btn-red" id="btnHelpSend">Gönder</button></div>'+
      '</div></div></div></div>';
  }

  function requireSess(next){
    if(!getSess()){go('/giris');return null}
    return next();
  }

  function bindPanel(){
    document.querySelectorAll('[data-go]').forEach(function(el){
      el.addEventListener('click',function(){var g=el.getAttribute('data-go');if(g&&g!=='#')go(g.replace(/^#/,''))});
    });
    var av=document.getElementById('btnAvatar');
    var menu=document.getElementById('userMenu');
    if(av&&menu){
      av.addEventListener('click',function(e){e.stopPropagation();menu.classList.toggle('open')});
      document.addEventListener('click',function(){menu.classList.remove('open')});
    }
    var lo=document.getElementById('btnLogout');
    if(lo)lo.addEventListener('click',function(){clearSess();toast('Çıkış yapıldı');go('/')});

    // mukellef modal
    var bm=document.getElementById('btnYeniMuk');
    var mm=document.getElementById('modalMuk');
    if(bm&&mm){bm.addEventListener('click',function(){mm.classList.remove('hide')})}
    ['closeMuk','cancelMuk'].forEach(function(id){
      var b=document.getElementById(id);if(b&&mm)b.addEventListener('click',function(){mm.classList.add('hide')});
    });
    var sm=document.getElementById('sendMuk');
    if(sm)sm.addEventListener('click',function(){
      var s=getSess()||{};
      var no=((document.getElementById('mukNo')||{}).value||'').trim();
      var ad=((document.getElementById('mukAd')||{}).value||'').trim();
      var em=((document.getElementById('mukMail')||{}).value||'').trim();
      if(!/^\d{6}$/.test(no)){ toast('6 haneli müşteri no girin'); return; }
      if(!ad){ toast('Ad soyad / unvan girin'); return; }
      if(String(s.musteriNo)===no){ toast('Kendinizi davet edemezsiniz'); return; }
      var list=readInvites();
      var exists=list.some(function(x){ return x.status!=='rejected' && String(x.mukMusteriNo)===no && String(x.mmMusteriNo)===String(s.musteriNo); });
      if(exists){ toast('Bu mükellef için zaten davet var'); return; }
      list.push({
        id:uidInv(),
        direction:'mm_to_muk',
        mmMusteriNo:String(s.musteriNo||''),
        mmName:s.name||'',
        mmEmail:s.email||'',
        mukMusteriNo:no,
        mukName:ad,
        mukEmail:em,
        status:'pending_muk',
        created:new Date().toISOString()
      });
      writeInvites(list);
      toast('Davet gönderildi — mükellef YanMuhasebe girince görür');
      if(mm) mm.classList.add('hide');
      render();
    });

    // calisan modal
    var bc=document.getElementById('btnYeniCal');
    var mc=document.getElementById('modalCal');
    if(bc&&mc){bc.addEventListener('click',function(){mc.classList.remove('hide')})}
    ['closeCal','cancelCal'].forEach(function(id){
      var b=document.getElementById(id);if(b&&mc)b.addEventListener('click',function(){mc.classList.add('hide')});
    });
    var sc=document.getElementById('sendCal');
    if(sc)sc.addEventListener('click',function(){
      var s=getSess()||{};
      var no=((document.getElementById('calNo')||{}).value||'').trim();
      var ad=((document.getElementById('calAd')||{}).value||'').trim();
      var un=((document.getElementById('calUnvan')||{}).value||'').trim();
      if(!/^\d{6}$/.test(no)){ toast('6 haneli müşteri no girin'); return; }
      if(!ad){ toast('Ad soyad girin'); return; }
      if(String(s.musteriNo)===no){ toast('Kendinizi davet edemezsiniz'); return; }
      var list=readInvites();
      var exists=list.some(function(x){ return x.kind==='calisan' && x.status!=='rejected' && String(x.calMusteriNo)===no && String(x.mmMusteriNo)===String(s.musteriNo); });
      if(exists){ toast('Bu çalışan için zaten davet var'); return; }
      list.push({
        id:uidInv(),
        kind:'calisan',
        direction:'mm_to_cal',
        mmMusteriNo:String(s.musteriNo||''),
        mmName:s.name||'',
        calMusteriNo:no,
        calName:ad,
        calUnvan:un,
        status:'pending_cal',
        created:new Date().toISOString()
      });
      writeInvites(list);
      toast('Davet gönderildi — çalışan YanMuhasebe girince onaylar');
      if(mc) mc.classList.add('hide');
      render();
    });

    var sp=document.getElementById('btnSavePass');
    if(sp)sp.addEventListener('click',function(){toast('Şifre güncellendi')});
    var hs=document.getElementById('btnHelpSend');
    if(hs)hs.addEventListener('click',function(){toast('Mesaj gönderildi');});
    var hf=document.getElementById('btnFile');
    if(hf)hf.addEventListener('click',function(){toast('Dosya eklendi')});

    document.querySelectorAll('[data-acc]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-acc');
        var list=readInvites();
        var inv=list.find(function(x){ return x.id===id; });
        if(!inv) return;
        inv.status='accepted';
        inv.acceptedAt=new Date().toISOString();
        writeInvites(list);
        pushNotif(inv.mukMusteriNo||inv.fromMusteriNo, 'Mali müşavir davetinizi onayladı.', 'ok');
        toast('Mükellef onaylandı');
        render();
      });
    });
    document.querySelectorAll('[data-rej]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-rej');
        var list=readInvites();
        var inv=list.find(function(x){ return x.id===id; });
        if(!inv) return;
        inv.status='rejected';
        writeInvites(list);
        pushNotif(inv.mukMusteriNo||inv.fromMusteriNo, 'Mali müşavir davetinizi reddetti.', 'bad');
        toast('Davet reddedildi');
        render();
      });
    });
    
    var sr=document.getElementById('mukSearch');
    if(sr){
      sr.addEventListener('keydown',function(e){
        if(e.key==='Enter'){
          var v=(sr.value||'').trim();
          location.hash='#/mukellefler'+(v?('?q='+encodeURIComponent(v)):'');
        }
      });
    }
    document.querySelectorAll('[data-giris]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-giris');
        var inv=readInvites().find(function(x){ return x.id===id; });
        if(!inv){ toast('Kayıt bulunamadı'); return; }
        setActiveMuk({ id:inv.id, no:inv.mukMusteriNo, ad:inv.mukName, em:inv.mukEmail });
        go('/ws/ozet');
      });
    });
    document.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click',function(){
        if(!confirm('Bu mükellef bağlantısı silinsin mi?')) return;
        var id=b.getAttribute('data-del');
        var list=readInvites().filter(function(x){ return x.id!==id; });
        writeInvites(list);
        toast('Silindi');
        render();
      });
    });
    document.querySelectorAll('[data-ws]').forEach(function(b){
      b.addEventListener('click',function(){ go('/ws/'+b.getAttribute('data-ws')); });
    });
    var bb=document.getElementById('btnBackMuk');
    if(bb) bb.addEventListener('click',function(){ go('/mukellefler'); });

    
    document.querySelectorAll('[data-del-cal]').forEach(function(b){
      b.addEventListener('click',function(){
        if(!confirm('Çalışan bağlantısı silinsin mi?')) return;
        var id=b.getAttribute('data-del-cal');
        writeInvites(readInvites().filter(function(x){ return x.id!==id; }));
        toast('Silindi');
        render();
      });
    });

    document.querySelectorAll('[data-nr]').forEach(function(b){
      b.addEventListener('click',function(){
        var id=b.getAttribute('data-nr');
        var n=readNotifs();
        n.forEach(function(x){ if(x.id===id) x.read=true; });
        writeNotifs(n);
        render();
      });
    });
  }

  function bindAuth(){
    var lf=document.getElementById('loginForm');
    if(lf)lf.addEventListener('submit',function(e){
      e.preventDefault();
      var em=(document.getElementById('loginEmail').value||'').trim();
      var name=em.split('@')[0]||'Kullanıcı';
      setSess({name:name,email:em});
      toast('Giriş yapıldı');
      go('/mukellefler');
    });
    var rf=document.getElementById('regForm');
    if(rf)rf.addEventListener('submit',function(e){
      e.preventDefault();
      var name=(document.getElementById('regName').value||'').trim()||'Yeni Kullanıcı';
      var em=(document.getElementById('regEmail').value||'').trim();
      setSess({name:name,email:em});
      toast('Kayıt tamamlandı');
      go('/mukellefler');
    });
    var fb=document.getElementById('btnForgot');
    if(fb)fb.addEventListener('click',function(){toast('Şifre sıfırlama bağlantısı gönderildi')});
    var dots=document.getElementById('slideDots');
    if(dots)dots.addEventListener('click',function(e){
      var b=e.target.closest('button[data-i]');if(!b)return;
      slideIdx=parseInt(b.getAttribute('data-i'),10)||0;render();
    });
  }

  function render(){
    var h=route();
    var root=document.getElementById('app');
    var panelRoutes=['/mukellefler','/mukellefler-onay','/calisanlar','/calisanlar-onay','/sifre','/yardim'];
    if(h.indexOf('/ws')===0) panelRoutes.push(h);
    if(panelRoutes.indexOf(h)>=0 && !getSess()){go('/giris');return}
    if(h==='/giris'||h==='/giris-yap'||h==='/login') root.innerHTML=viewLogin();
    else if(h==='/kayit'||h==='/kayit-ol'||h==='/register') root.innerHTML=viewRegister();
    else if(h==='/mukellefler'||h==='/mukellefler-onay') root.innerHTML=viewMukellefler();
    else if(h.indexOf('/ws')===0){
      var mid=(h.split('/')[2]||'ozet');
      root.innerHTML=viewWorkspace(mid);
    }
    else if(h==='/calisanlar'||h==='/calisanlar-onay') root.innerHTML=viewCalisanlar();
    else if(h==='/sifre') root.innerHTML=viewSifre();
    else if(h==='/yardim') root.innerHTML=viewYardim();
    else root.innerHTML=viewLand();
    bindAuth();
    bindPanel();
  }

  window.addEventListener('hashchange',render);
  setInterval(function(){
    var r=route();
    if(r==='/giris'||r==='/kayit'||r==='/giris-yap'||r==='/kayit-ol'){
      slideIdx=(slideIdx+1)%slides.length;
      var panel=document.querySelector('.auth-panel-content');
      var dots=document.getElementById('slideDots');
      if(panel){var s=slides[slideIdx];panel.innerHTML='<h2>'+s.h+'</h2><p>'+s.p+'</p>'}
      if(dots){[].forEach.call(dots.querySelectorAll('button'),function(b,i){b.className=i===slideIdx?'on':''})}
    }
  },6000);
  render();
})();
</script>
</body>
</html>
